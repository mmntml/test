name: Meine erste CI-Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Dateien überprüfen
        run: |
          test -f index.html
          test -f style.css
          test -f script.js

      - name: JavaScript überprüfen
        run: node --check script.js
